  <rect x="58" y="576" width="120" height="8" rx="4" fill="#22e0d0"/>
  <text x="58" y="648" font-family="PingFang TC,Microsoft JhengHei,sans-serif" font-size="25" font-weight="600" fill="#ffffff" opacity="0.95">別人在看，你在看見</text>
  <text x="58" y="712" font-family="PingFang TC,Microsoft JhengHei,sans-serif" font-size="20" fill="#ffffff" opacity="0.7">TedsTalk 超能力系列</text>
